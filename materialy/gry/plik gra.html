<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #111827;
            color: #f9fafb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        canvas {
            background: #1f2937;
            border: 4px solid #374151;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .info {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #9ca3af;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Retro Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="info">Steruj za pomocą <strong>strzałek</strong>. Spacja restartuje grę po przegranej.</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let isGameOver = false;
        let changingDirection = false; // Zapobiega szybkiemu podwójnemu kliknięciu samobójczemu

        // Nasłuchiwanie klawiatury
        document.addEventListener('keydown', changeDirection);

        function main() {
            if (isGameOver) return;

            setTimeout(() => {
                changingDirection = false;
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                checkGameOver();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "#1f2937";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#10b981' : '#34d399';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Sprawdzenie czy zjadł jabłko
            if (head.x === food.x && head.y === food.y) {
                score++;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Upewnienie się, że jabłko nie pojawi się na wężu
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;
            const SPACE = 32;

            if (keyPressed === SPACE && isGameOver) {
                resetGame();
                return;
            }

            if (changingDirection) return;

            if (keyPressed === LEFT && dx === 0) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === UP && dy === 0) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            if (keyPressed === RIGHT && dx === 0) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === DOWN && dy === 0) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        }

        function checkGameOver() {
            const head = snake[0];

            // Kolizja ze ścianami
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitToptWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
                isGameOver = true;
            }

            // Kolizja z własnym ogonem
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    isGameOver = true;
                }
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(17, 24, 39, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f9fafb';
                ctx.font = 'bold 28px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText('KONIEC GRY', canvas.width / 2, canvas.height / 2 - 20);

                ctx.font = '16px Segoe UI';
                ctx.fillStyle = '#9ca3af';
                ctx.fillText(`Wynik: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillText('Naciśnij SPACJĘ, aby zagrać ponownie', canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = 'left';
            }
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            isGameOver = false;
            generateFood();
            main();
        }

        // Start gry
        generateFood();
        main();
    </script>
</body>
</html>
